<!doctype html>

<title>Ruta Viral China</title>
<meta name="description" content="Tu viaje día a día, lo más viral, réplicas, panaderías, restaurantes, tecnología y gastos en Beijing, Xi'an, Chengdu, Lijiang, Shanghái y Seúl. Funciona sin internet.">

</head>

<header class="appbar">
  <div class="wrap appbar-in">
    <button class="icon-btn" id="back" type="button" aria-label="Regresar a Más" hidden>‹</button>
    <b class="appbar-title" id="title">Hoy</b>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="hotel-btn" type="button" data-hotel="" aria-label="Mostrar mi hotel al chofer">Hotel</button>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="tabbar" aria-label="Secciones de la app">
  <div class="tabbar-in">
    <button class="tab" type="button" data-tab="ciudades"><span class="tab-ico"><svg viewBox="0 0 24 24"><use href="#i-city"/></svg></span><span class="tlab">Ciudades</span></button>
    <button class="tab" type="button" data-tab="buscar"><span class="tab-ico"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></span><span class="tlab">Buscar</span></button>
    <button class="tab tab-hoy" type="button" data-tab="hoy"><span class="hoy-pill">Hoy</span></button>
    <button class="tab" type="button" data-tab="virales"><span class="tab-ico"><svg viewBox="0 0 24 24" class="ico-fill"><use href="#i-spark"/></svg></span><span class="tlab">Virales</span></button>
    <button class="tab" type="button" data-tab="mas"><span class="tab-ico"><svg viewBox="0 0 24 24"><use href="#i-grid"/></svg></span><span class="tlab">Más</span></button>
  </div>
</nav>

<dialog id="driver" aria-labelledby="dz">
  <div class="card">
    <img id="dimg" alt="" hidden>
    <p class="ask" id="dask" lang="zh">师傅，请带我去这里：</p>
    <p class="big" id="dz" lang="zh"></p>
    <p class="where" id="da" lang="zh"></p>
    <p class="es" id="dn"></p>
    <div class="row">
      <button class="btn primary" id="dcopy" type="button">Copiar para Didi</button>
      <button class="btn" id="dsay" type="button" hidden>Escuchar</button>
      <a class="btn" id="dmap" target="_blank" rel="noopener">Mapas (con internet)</a>
      <button class="btn" id="dclose" type="button">Cerrar</button>
    </div>
  </div>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>

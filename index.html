<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruta Viral China</title>
<meta name="description" content="Tu viaje día a día, lo más viral, réplicas, panaderías, restaurantes, tecnología y gastos en Beijing, Xi'an, Chengdu, Lijiang, Shanghái y Seúl. Funciona sin internet.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EFF2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruta Viral">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="appbar">
  <div class="wrap appbar-in">
    <button class="icon-btn" id="back" type="button" aria-label="Regresar a Más" hidden>‹</button>
    <b class="appbar-title" id="title">Hoy</b>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="hotel-btn" type="button" data-hotel="" aria-label="Mostrar mi hotel al chofer"><span lang="zh">酒店</span></button>
  </div>
</header>

<main class="wrap" id="app"></main>

<nav class="tabbar" aria-label="Secciones de la app">
  <button class="tab" type="button" data-tab="ciudades"><span class="ti" lang="zh">城</span><span class="tlab">Ciudades</span></button>
  <button class="tab" type="button" data-tab="buscar"><span class="ti" lang="zh">搜</span><span class="tlab">Buscar</span></button>
  <button class="tab tab-hoy" type="button" data-tab="hoy"><span class="ti" lang="zh">今</span><span class="tlab">Hoy</span></button>
  <button class="tab" type="button" data-tab="virales"><span class="ti" lang="zh">热</span><span class="tlab">Virales</span></button>
  <button class="tab" type="button" data-tab="mas"><span class="ti" lang="zh">多</span><span class="tlab">Más</span></button>
</nav>

<dialog id="driver" aria-labelledby="dz">
  <div class="card">
    <p class="ask" id="dask" lang="zh">师傅，请带我去这里：</p>
    <p class="big" id="dz" lang="zh"></p>
    <p class="where" id="da" lang="zh"></p>
    <p class="es" id="dn"></p>
    <div class="row">
      <button class="btn primary" id="dcopy" type="button">Copiar para Didi</button>
      <a class="btn" id="dmap" target="_blank" rel="noopener">Mapas (con internet)</a>
      <button class="btn" id="dclose" type="button">Cerrar</button>
    </div>
  </div>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
